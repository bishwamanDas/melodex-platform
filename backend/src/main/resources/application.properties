spring.application.name=music-catalog

# Database Configuration (H2 File-based for easy reviewer setup, behaves like PostgreSQL)
spring.datasource.url=jdbc:h2:file:./data/musiccatalog;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Secret (Should be overriden via ENV in production)
jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b2a757da917ec8942289c02db555b71db3}

# Gemini API Key (Placeholder)
gemini.api.key=${GEMINI_API_KEY:placeholder}
